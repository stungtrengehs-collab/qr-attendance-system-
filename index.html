                        <div class="flex flex-wrap gap-2">
                            <button onclick="printHTML(document.getElementById('fullReportArea').innerHTML)" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow-xs">
                                <i class="fas fa-print text-primary-600"></i> បោះពុម្ព PDF
                            </button>
                            <button onclick="exportComprehensiveReportCSV()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold shadow-xs flex items-center gap-1.5">
                                <i class="fas fa-file-excel"></i> ទាញយក Excel (.CSV)
                            </button>
                            <button onclick="exportFullSystemBackup()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold shadow-xs flex items-center gap-1.5">
                                <i class="fas fa-database"></i> ទាញយក Backup (.JSON)
                            </button>
                        </div>
                    </div>

                    <!-- Printable Report Content -->
                    <div id="fullReportArea" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div class="bg-white p-5 rounded-2xl border border-slate-200">
                                <p class="text-xs text-slate-500 font-semibold uppercase">សិស្សសរុបក្នុងឆ្នាំនេះ</p>
                                <h4 class="text-2xl font-bold text-slate-800 mt-1">${yearStudents.length} នាក់</h4>
                                <p class="text-xs text-emerald-600 mt-1">ប្រុស៖ ${yearStudents.filter(s=>s.gender==='ប្រុស').length} | ស្រី៖ ${yearStudents.filter(s=>s.gender==='ស្រី').length}</p>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border border-slate-200">
                                <p class="text-xs text-slate-500 font-semibold uppercase">គ្រូបង្រៀន & បុគ្គលិក</p>
                                <h4 class="text-2xl font-bold text-slate-800 mt-1">${db.teachers.length + db.staff.length} នាក់</h4>
                                <p class="text-xs text-primary-600 mt-1">គ្រូ៖ ${db.teachers.length} | បុគ្គលិក៖ ${db.staff.length}</p>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border border-slate-200">
                                <p class="text-xs text-slate-500 font-semibold uppercase">សមតុល្យហិរញ្ញវត្ថុ</p>
                                <h4 class="text-2xl font-bold text-emerald-600 mt-1">$${(totalIncome - totalExpense).toFixed(2)}</h4>
                                <p class="text-xs text-slate-500 mt-1">ចំណូល៖ $${totalIncome.toFixed(2)} | ចំណាយ៖ $${totalExpense.toFixed(2)}</p>
                            </div>
                        </div>

                        <!-- Class Statistics Table -->
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                <h4 class="font-bold text-slate-800 text-base">ស្ថិតិសិស្សតាមបន្ទប់សិក្សា</h4>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-semibold text-slate-600">ត្រងតាមថ្នាក់/បន្ទប់៖</span>
                                    <select id="reportRoomFilterSelect" onchange="renderReports(document.getElementById('mainContent'))" class="px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium outline-none focus:ring-2 focus:ring-primary-500">
                                        <option value="ALL">-- គ្រប់បន្ទប់ទាំងអស់ --</option>
                                        ${db.classes.map(c => `<option value="${c.room}">ថ្នាក់ ${c.room} (${c.group || 'ទូទៅ'})</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm">
                                    <thead class="bg-slate-50 text-slate-600 border-b">
                                        <tr>
                                            <th class="py-2.5 px-3">បន្ទប់ / ថ្នាក់</th>
                                            <th class="py-2.5 px-3">កម្រិត</th>
                                            <th class="py-2.5 px-3">ក្រុមសិក្សា</th>
                                            <th class="py-2.5 px-3 text-center">ចំនួនសិស្ស</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        ${(() => {
                                            const selectedRoomFilter = document.getElementById('reportRoomFilterSelect')?.value || 'ALL';
                                            const filteredClasses = db.classes.filter(cls => selectedRoomFilter === 'ALL' || cls.room === selectedRoomFilter);
                                            
                                            if (filteredClasses.length === 0) {
                                                return `<tr><td colspan="4" class="py-6 text-center text-slate-400">មិនមានទិន្នន័យថ្នាក់រៀនទេ</td></tr>`;
                                            }
                                            
                                            return filteredClasses.map(cls => {
                                                const count = yearStudents.filter(s => s.room === cls.room).length;
                                                return `
                                                    <tr>
                                                        <td class="py-2.5 px-3 font-bold text-primary-600">ថ្នាក់ ${cls.room}</td>
                                                        <td class="py-2.5 px-3">ថ្នាក់ទី ${cls.grade}</td>
                                                        <td class="py-2.5 px-3">${cls.group || 'ទូទៅ'}</td>
                                                        <td class="py-2.5 px-3 text-center font-bold">${count} នាក់</td>
                                                    </tr>
                                                `;
                                            }).join('');
                                        })()}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        /**
         * ============================================================================
         * MODULE 12: USERS & RBAC (គ្រប់គ្រងអ្នកប្រើប្រាស់ និងសិទ្ធិ)
         * ============================================================================
         */
        function renderUsers(container) {
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-100 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-slate-800">គ្រប់គ្រងអ្នកប្រើប្រាស់ និងសិទ្ធិ (RBAC)</h3>
                            <p class="text-xs text-slate-500">កំណត់តួនាទី និងសិទ្ធិប្រើប្រាស់ប្រព័ន្ធសម្រាប់បុគ្គលិកម្នាក់ៗ</p>
                        </div>
                        <button onclick="openUserModal()" class="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-xl text-sm font-medium shadow-md">+ បន្ថែមអ្នកប្រើប្រាស់</button>
                    </div>

                    <div class="bg-white rounded-2xl shadow-xs border border-slate-100 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-slate-50 text-slate-600 border-b">
                                    <tr>
                                        <th class="py-3 px-4">អត្តលេខ</th>
                                        <th class="py-3 px-4">ឈ្មោះអ្នកប្រើប្រាស់</th>
                                        <th class="py-3 px-4">ឈ្មោះពេញ</th>
                                        <th class="py-3 px-4">តួនាទី (Role)</th>
                                        <th class="py-3 px-4">ស្ថានភាព</th>
                                        <th class="py-3 px-4 text-right">សកម្មភាព</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${db.users.map(u => `
                                        <tr class="hover:bg-slate-50/80 transition">
                                            <td class="py-3 px-4 font-mono text-xs">${u.id}</td>
                                            <td class="py-3 px-4 font-semibold text-primary-600">${u.username}</td>
                                            <td class="py-3 px-4 font-bold text-slate-800">${u.fullName}</td>
                                            <td class="py-3 px-4"><span class="px-2.5 py-1 bg-blue-50 text-blue-700 rounded-lg text-xs font-semibold">${u.role}</span></td>
                                            <td class="py-3 px-4">
                                                <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${u.status === 'Active' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-600'}">
                                                    ${u.status}
                                                </span>
                                            </td>
                                            <td class="py-3 px-4 text-right space-x-1 whitespace-nowrap">
                                                <button onclick="openUserModal('${u.id}')" title="កែប្រែ" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded-lg transition"><i class="fas fa-edit"></i></button>
                                                ${u.username !== 'admin' ? `<button onclick="deleteUser('${u.id}')" title="លុប" class="p-1.5 text-red-600 hover:bg-red-50 rounded-lg transition"><i class="fas fa-trash"></i></button>` : ''}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function openUserModal(userId = null) {
            const u = userId ? db.users.find(x => x.id === userId) : null;
            const roles = ['Super Admin', 'នាយកសាលា', 'អ្នកគ្រប់គ្រង', 'គ្រូបង្រៀន', 'គណនេយ្យករ', 'បណ្ណារក្ស', 'បុគ្គលិក'];
            openModal(u ? 'កែប្រែអ្នកប្រើប្រាស់' : 'បង្កើតអ្នកប្រើប្រាស់ថ្មី', `
                <form id="usrForm" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold mb-1">ឈ្មោះអ្នកប្រើប្រាស់ (Username) *</label>
                            <input type="text" id="usrName" required ${u ? 'readonly' : ''} value="${u ? u.username : ''}" class="w-full px-3 py-2 border rounded-xl text-sm ${u ? 'bg-slate-100' : ''}" placeholder="username">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">ឈ្មោះពេញ (Full Name) *</label>
                            <input type="text" id="usrFull" required value="${u ? u.fullName : ''}" class="w-full px-3 py-2 border rounded-xl text-sm" placeholder="សុខ វណ្ណា">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">ពាក្យសម្ងាត់ថ្មី (Password)</label>
                            <input type="password" id="usrPass" ${u ? '' : 'required'} placeholder="${u ? 'ទុកទទេបើមិនប្តូរ' : '••••••'}" class="w-full px-3 py-2 border rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">តួនាទី (Role) *</label>
                            <select id="usrRole" class="w-full px-3 py-2 border rounded-xl text-sm">
                                ${roles.map(r => `<option value="${r}" ${u?.role === r ? 'selected' : ''}>${r}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">ស្ថានភាព</label>
                            <select id="usrStatus" class="w-full px-3 py-2 border rounded-xl text-sm">
                                <option value="Active" ${u?.status === 'Active' ? 'selected' : ''}>ដំណើរការ (Active)</option>
                                <option value="Inactive" ${u?.status === 'Inactive' ? 'selected' : ''}>ផ្អាក (Inactive)</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-sm">បោះបង់</button>
                        <button type="submit" class="px-5 py-2 bg-primary-600 text-white rounded-xl text-sm font-semibold shadow-md">រក្សាទុក</button>
                    </div>
                </form>
            `);
            document.getElementById('usrForm').onsubmit = async (e) => {
                e.preventDefault();
                const passInput = document.getElementById('usrPass').value;
                const hashedPassword = passInput ? await hashPassword(passInput) : (u ? u.passwordHash : await hashPassword('123456'));

                const data = {
                    id: u ? u.id : 'U' + String(db.users.length + 1).padStart(2, '0'),
                    username: document.getElementById('usrName').value.trim(),
                    passwordHash: hashedPassword,
                    fullName: document.getElementById('usrFull').value.trim(),
                    role: document.getElementById('usrRole').value,
                    status: document.getElementById('usrStatus').value
                };

                if (u) {
                    const idx = db.users.findIndex(x => x.id === u.id);
                    db.users[idx] = data;
                    logAudit('កែប្រែអ្នកប្រើប្រាស់', data.username);
                    showToast('បានកែប្រែអ្នកប្រើប្រាស់ជោគជ័យ!', 'success');
                } else {
                    db.users.push(data);
                    logAudit('បង្កើតអ្នកប្រើប្រាស់ថ្មី', data.username);
                    showToast('បានបង្កើតអ្នកប្រើប្រាស់ថ្មីជោគជ័យ!', 'success');
                }
                saveDB(); closeModal(); renderUsers(document.getElementById('mainContent'));
            };
        }

        function deleteUser(id) {
            const u = db.users.find(x => x.id === id);
            if (!u) return;
            confirmDelete(`គណនី "${u.username}"`, () => {
                db.users = db.users.filter(x => x.id !== id);
                logAudit('លុបអ្នកប្រើប្រាស់', u.username);
                saveDB();
                renderUsers(document.getElementById('mainContent'));
                showToast(`បានលុបគណនី ${u.username} រួចរាល់`, 'info');
            });
        }

        /**
         * ============================================================================
         * MODULE 13: SETTINGS & BACKUP (ការកំណត់ និង Backup / Restore)
         * ============================================================================
         */
        function renderSettings(container) {
            container.innerHTML = `
                <div class="max-w-2xl mx-auto space-y-6">
                    <!-- School Profile Settings -->
                    <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-100 space-y-4">
                        <h3 class="font-bold text-slate-800 text-base"><i class="fas fa-school text-primary-600 mr-2"></i>ការកំណត់ព័ត៌មានសាលារៀន</h3>
                        <form id="schoolSettingsForm" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold mb-1">ឈ្មោះសាលា (ភាសាខ្មែរ)</label>
                                <input type="text" id="setSchoolKh" required value="${db.settings.schoolNameKh}" class="w-full px-3 py-2 border rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1">ឈ្មោះសាលា (English)</label>
                                <input type="text" id="setSchoolEn" required value="${db.settings.schoolNameEn}" class="w-full px-3 py-2 border rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1">អត្រាប្តូរប្រាក់ស្តង់ដារ (1 USD)</label>
                                <input type="number" id="setRate" required value="${db.settings.exchangeRate}" class="w-full px-3 py-2 border rounded-xl text-sm font-bold">
                            </div>
                            <button type="submit" class="px-5 py-2.5 bg-primary-600 hover:bg-primary-700 text-white rounded-xl text-sm font-semibold shadow-md">រក្សាទុកការកំណត់</button>
                        </form>
                    </div>

                    <!-- Backup & Restore Data -->
                    <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-100 space-y-4">
                        <h3 class="font-bold text-slate-800 text-base"><i class="fas fa-database text-emerald-600 mr-2"></i>ការរក្សាទុក និងទាញយកទិន្នន័យ (Backup & Restore)</h3>
                        <p class="text-xs text-slate-500">អ្នកអាចរក្សាទុកទិន្នន័យទាំងអស់ទុកក្នុងកុំព្យូទ័រ (Backup) ឬទាញយកទិន្នន័យចាស់មកប្រើប្រាស់វិញ (Restore) ដើម្បីការពារការបាត់បង់ទិន្នន័យរយៈពេលវែង។</p>
                        
                        <div class="flex flex-wrap gap-3 pt-2">
                            <button onclick="exportFullSystemBackup()" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold shadow-sm flex items-center gap-2">
                                <i class="fas fa-file-export"></i> Backup ទិន្នន័យ (.JSON)
                            </button>
                            <label class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold flex items-center gap-2 cursor-pointer transition">
                                <i class="fas fa-file-import"></i> Restore ទិន្នន័យ
                                <input type="file" accept=".json" onchange="importSystemBackup(event)" class="hidden">
                            </label>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('schoolSettingsForm').onsubmit = (e) => {
                e.preventDefault();
                db.settings.schoolNameKh = document.getElementById('setSchoolKh').value.trim();
                db.settings.schoolNameEn = document.getElementById('setSchoolEn').value.trim();
                db.settings.exchangeRate = Number(document.getElementById('setRate').value);
                saveDB();
                updateHeaderInfo();
                showToast('បានរក្សាទុកការកំណត់សាលារៀនជោគជ័យ!', 'success');
            };
        }

        function exportFullSystemBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `SchoolManagement_Backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('បានទាញយក Backup ទិន្នន័យប្រព័ន្ធរួចរាល់!', 'success');
        }

        function importSystemBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && imported.settings && imported.students) {
                        db = imported;
                        saveDB();
                        updateHeaderInfo();
                        renderSidebar();
                        navigateTo('dashboard');
                        showToast('🎉 បាន Restore ទិន្នន័យចូលប្រព័ន្ធជោគជ័យ!', 'success');
                    } else {
                        showToast('❌ ဖក្សាយឯកសារ Backup មិនត្រឹមត្រូវទេ!', 'error');
                    }
                } catch (err) {
                    showToast('❌ មានបញ្ហាក្នុងការអានឯកសារ JSON!', 'error');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
