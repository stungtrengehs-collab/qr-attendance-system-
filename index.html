    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Kantumruy Pro"', 'Inter', 'sans-serif'],

                        secondary: { 500: '#10b981', 600: '#059669' }

<body class="text-slate-800 antialiased selection:bg-primary-500 selection:text-white">

    <!-- ========================================== -->

            <!-- Brand Header -->

                        <i class="fas fa-cloud-upload-alt"></i> <span class="hidden sm:inline">Sync Cloud</span>

    <div id="printArea" class="hidden"></div>

    <!-- 4. JAVASCRIPT APPLICATION LOGIC            -->
    <!-- ========================================== -->
    <script>
        /**
         * ============================================================================
         * SYSTEM ARCHITECTURE & DATABASE LAYER (In-Memory + Persistence Ready)
         * ============================================================================
         */
        const DB_KEY = 'SMS_KHMER_DB_V1';

        // Clean Empty Initial Database Schema (No Dummy Data)
        const defaultDatabase = {
            settings: {
                schoolNameKh: 'វិទ្យាល័យ ហ៊ុន សែន',
                schoolNameEn: 'Hun Sen High School',
                exchangeRate: 4100, // 1 USD = 4100 KHR
                currentYear: '2025-2026',
                academicYears: ['2024-2025', '2025-2026', '2026-2027'],
                version: '1.0.0'
            },
            users: [
                { id: 'U01', username: 'admin', passwordHash: '8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92', fullName: 'សុខ វណ្ណា (Super Admin)', role: 'Super Admin', status: 'Active' },
                { id: 'U02', username: 'director', passwordHash: '8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92', fullName: 'បណ្ឌិត ចាន់ សុភាព', role: 'នាយកសាលា', status: 'Active' },
                { id: 'U03', username: 'teacher', passwordHash: '8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92', fullName: 'កញ្ញា លី សុភា', role: 'គ្រូបង្រៀន', status: 'Active' },
                { id: 'U04', username: 'accountant', passwordHash: '8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92', fullName: 'អ្នកស្រី កែវ ម៉ាលី', role: 'គណនេយ្យករ', status: 'Active' },
                { id: 'U05', username: 'librarian', passwordHash: '8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92', fullName: 'លោក ហេង ពិសិដ្ឋ', role: 'បណ្ណារក្ស', status: 'Active' }
            ],
            // Role-Based Access Control Matrix
            permissions: {
                'Super Admin': ['dashboard', 'directory', 'classes', 'students', 'teachers', 'attendance', 'subjects', 'curriculum', 'grades', 'finance', 'library', 'inventory', 'staff', 'reports', 'users', 'settings'],
                'នាយកសាលា': ['dashboard', 'directory', 'classes', 'students', 'teachers', 'attendance', 'subjects', 'curriculum', 'grades', 'finance', 'library', 'inventory', 'staff', 'reports', 'users'],
                'អ្នកគ្រប់គ្រង': ['dashboard', 'directory', 'classes', 'students', 'teachers', 'attendance', 'subjects', 'curriculum', 'grades', 'library', 'inventory', 'reports'],
                'គ្រូបង្រៀន': ['dashboard', 'directory', 'classes', 'students', 'attendance', 'subjects', 'curriculum', 'grades', 'reports'],
                'គណនេយ្យករ': ['dashboard', 'directory', 'students', 'finance', 'staff', 'reports'],
                'បណ្ណារក្ស': ['dashboard', 'directory', 'students', 'library', 'reports'],
                'បុគ្គលិក': ['dashboard', 'directory', 'attendance', 'inventory']
            },
            curriculum: [],
            classes: [],
            students: [],
            teachers: [],
            subjects: [
                { id: 'SUB-01', code: 'MATH', nameKh: 'គណិតវិទ្យា', nameEn: 'Mathematics', grades: '7-12', maxScore: 125 },
                { id: 'SUB-02', code: 'KHMER', nameKh: 'អក្សរសាស្ត្រខ្មែរ', nameEn: 'Khmer Literature', grades: '7-12', maxScore: 100 },
                { id: 'SUB-03', code: 'PHYS', nameKh: 'រូបវិទ្យា', nameEn: 'Physics', grades: '7-12', maxScore: 75 },
                { id: 'SUB-04', code: 'CHEM', nameKh: 'គីមីវិទ្យា', nameEn: 'Chemistry', grades: '7-12', maxScore: 75 },
                { id: 'SUB-05', code: 'ENG', nameKh: 'ភាសាអង់គ្លេស', nameEn: 'English', grades: '7-12', maxScore: 50 }
            ],
            schedules: [],
            attendance: [],
            grades: [],
            finance: [],
            library: [],
            borrowRecords: [],
            inventory: [],
            staff: [],
            auditLogs: [
                { id: 'LOG-01', timestamp: new Date().toLocaleString('km-KH'), user: 'admin', action: 'ចាប់ផ្តើមប្រព័ន្ធ (System Initialized)', details: 'បានសម្អាតទិន្នន័យគំរូទាំងអស់រួចរាល់' }
            ]
        };

        // Load or Initialize DB
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || JSON.parse(JSON.stringify(defaultDatabase));
        let currentUser = null;
        let currentLang = 'km'; // 'km' or 'en'
        let currentTab = 'dashboard';
        let firebaseAppInstance = null;
        let rtdbRef = null;

        // Initialize Firebase on load if config exists in localStorage
        window.addEventListener('DOMContentLoaded', () => {
            try {
                initFirebaseFromStorage();
            } catch (e) {
                console.error("Initialization error:", e);
            }
        });

        function initFirebaseFromStorage() {
            const savedConfig = localStorage.getItem('FIREBASE_CONFIG_JSON');
            if (!savedConfig) return;
            try {
                const config = JSON.parse(savedConfig);
                if (typeof firebase !== 'undefined') {
                    if (firebase.apps.length === 0) {
                        firebaseAppInstance = firebase.initializeApp(config);
                    } else {
                        firebaseAppInstance = firebase.apps[0];
                    }
                    rtdbRef = firebase.database().ref('school_system_data');
                    
                    // Realtime Listener
                    rtdbRef.on('value', (snapshot) => {
                        try {
                            const cloudData = snapshot.val();
                            if (cloudData && cloudData.settings) {
                                db = cloudData;
                                localStorage.setItem(DB_KEY, JSON.stringify(db));
                                if (currentUser) {
                                    updateHeaderInfo();
                                    navigateTo(currentTab);
                                }
                            }
                        } catch (err) {}
                    }, (err) => {});
                    console.log('Firebase Cloud Sync initialized successfully.');
                }
            } catch (err) {
                console.error('Firebase init error:', err);
            }
        }

        function openFirebaseConfigModal() {
            const savedConfig = localStorage.getItem('FIREBASE_CONFIG_JSON') || '';
            openModal('ភ្ជាប់ Firebase Realtime Database (ពីកូដ Config របស់អ្នក)', `
                <div class="space-y-4 text-sm">
                    <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800 space-y-1">
                        <p class="font-bold">📌 ជំហានយក Firebase Config ដូចក្នុងរូបភាពរបស់អ្នក:</p>
                        <p>១. Copy កូដ <code>const firebaseConfig = { ... };</code> ពី Firebase Console</p>
                        <p>២. យកមកបិទភ្ជាប់ (Paste) ក្នុងប្រអប់ខាងក្រោមនេះ:</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">Firebase Config (JSON format):</label>
                        <textarea id="fbConfigInput" rows="7" class="w-full p-3 font-mono text-xs border border-slate-300 rounded-xl bg-slate-50" placeholder='{
  "apiKey": "AIzaSy...",
  "authDomain": "school-management-system-4ea14.firebaseapp.com",
  "databaseURL": "https://school-management-system-4ea14-default-rtdb.asia-southeast1.firebasedatabase.app",
  "projectId": "school-management-system-4ea14",
  "storageBucket": "school-management-system-4ea14.appspot.com",
  "messagingSenderId": "686671411595",
  "appId": "1:686671411595:web:..."
}'>${savedConfig}</textarea>
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs">បោះបង់</button>
                        <button type="button" onclick="saveAndConnectFirebase()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md">
                            🔗 រក្សាទុក និងភ្ជាប់ Realtime DB
                        </button>
                    </div>
                </div>
            `);
        }

        function saveAndConnectFirebase() {
            const inputEl = document.getElementById('fbConfigInput');
            if (!inputEl) return;
            const val = inputEl.value.trim();
            try {
                let cleanVal = val;
                if (cleanVal.includes('const firebaseConfig')) {
                    const start = cleanVal.indexOf('{');
                    const end = cleanVal.lastIndexOf('}');
                    if (start !== -1 && end !== -1) {
                        cleanVal = cleanVal.substring(start, end + 1);
                    }
                }
                const parsed = JSON.parse(cleanVal);
                if (!parsed.apiKey || !parsed.projectId) {
                    throw new Error('Missing apiKey or projectId');
                }
                localStorage.setItem('FIREBASE_CONFIG_JSON', JSON.stringify(parsed));
                initFirebaseFromStorage();
                closeModal();
                showToast('🎉 បានរក្សាទុក និងភ្ជាប់ Firebase Realtime Database ជោគជ័យ!', 'success');
                syncToCloudDatabase();
            } catch (err) {
                showToast('❌ ទម្រង់ JSON មិនត្រឹមត្រូវ! សូមពិនិត្យកូដ firebaseConfig របស់អ្នក។', 'error');
            }
        }

            toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 transform transition-all translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="fas ${type==='success'?'fa-check-circle':type==='error'?'fa-exclamation-circle':'fa-info-circle'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {

                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // SHA-256 Password Hashing Simulation using Web Crypto API
        async function hashPassword(password) {
            try {
                const msgBuffer = new TextEncoder().encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            } catch (e) {
                return password; // Fallback plain text if crypto subtle fails in iframe
            }
        }

        function exportMonthlyAttendanceCSV() {
            const rows = [
                [`=== របាយការណ៍វត្តមានប្រចាំខែ ${reportSelectedMonth} (${attMonthlyTab}) ===`],
                ['អត្តលេខ', 'ឈ្មោះ', attMonthlyTab==='STUDENT'?'ថ្នាក់':'មុខវិជ្ជា', 'មានវត្តមាន', 'មកយឺត', 'មានច្បាប់', 'អវត្តមាន', 'សរុបកត់ត្រា', 'អត្រាវត្តមាន (%)']
            ];
            const filteredAttendance = db.attendance.filter(a => a.date && a.date.startsWith(reportSelectedMonth));
            if (attMonthlyTab === 'STUDENT') {
                db.students.filter(s => s.year === db.settings.currentYear && (attMonthlyRoomFilter === 'ALL' || s.room === attMonthlyRoomFilter)).forEach(stu => {
                    const stuAtts = filteredAttendance.filter(a => a.targetId === stu.id && a.targetType === 'Student');
                    const p = stuAtts.filter(a => a.status === 'មានវត្តមាន').length;
                    const l = stuAtts.filter(a => a.status === 'យឺត').length;
                    const e = stuAtts.filter(a => a.status === 'មានច្បាប់').length;
                    const ab = stuAtts.filter(a => a.status === 'អវត្តមាន').length;
                    const tot = stuAtts.length;
                    const rate = tot > 0 ? Math.round(((p + l) / tot) * 100) : 100;
                    rows.push([stu.id, stu.nameKh, stu.room, p, l, e, ab, tot, rate + '%']);
                });
            } else {
                db.teachers.forEach(tch => {
                    const tchAtts = filteredAttendance.filter(a => a.targetId === tch.id && a.targetType === 'Teacher');
                    const p = tchAtts.filter(a => a.status === 'មានវត្តមាន').length;
                    const l = tchAtts.filter(a => a.status === 'យឺត').length;
                    const e = tchAtts.filter(a => a.status === 'មានច្បាប់').length;
                    const ab = tchAtts.filter(a => a.status === 'អវត្តមាន').length;
                    const tot = tchAtts.length;
                    const rate = tot > 0 ? Math.round(((p + l) / tot) * 100) : 100;
                    rows.push([tch.id, tch.nameKh, tch.subject, p, l, e, ab, tot, rate + '%']);
                });
            }
            exportToCSV(`Monthly_Attendance_${reportSelectedMonth}.csv`, rows);

        function exportToCSV(filename, rows) {
            const csvContent = "\uFEFF" + rows.map(e => e.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            showToast(`បានទាញយកឯកសារ ${filename} រួចរាល់!`, 'success');
        }

                const dup = db.classes.find(c => c.room.toLowerCase() === roomName.toLowerCase() && c.year === db.settings.currentYear && c.id !== classId);

                    showToast(`ឈ្មោះថ្នាក់ "${roomName}" មានរួចហើយក្នុងឆ្នាំសិក្សានេះ!`, 'error');

                    id: cls ? cls.id : 'CLS-' + Date.now().toString().slice(-4),

                    room: roomName,

                    teacherId: document.getElementById('clsTeacher').value,

                    tgChatId: document.getElementById('clsTgChatId').value.trim(),
                    tgAutoNotify: document.getElementById('clsTgAutoNotify').checked

                    const idx = db.classes.findIndex(c => c.id === cls.id);

                    logAudit('កែប្រែថ្នាក់រៀន & Telegram', `ថ្នាក់ ${data.room}`);

                saveDB();
                closeModal();
                renderClassesAndTelegram(document.getElementById('mainContent'));

        function deleteClass(id) {
            const cls = db.classes.find(c => c.id === id);
            confirmDelete(`ថ្នាក់ ${cls.room}`, () => {
                db.classes = db.classes.filter(c => c.id !== id);
                logAudit('លុបថ្នាក់រៀន', `ថ្នាក់ ${cls.room}`);
                saveDB();
                renderClassesAndTelegram(document.getElementById('mainContent'));
                showToast(`បានលុបថ្នាក់ ${cls.room} រួចរាល់`, 'info');
            });
        }

        async function sendTelegramMessage(botToken, chatId, text) {
            if (!botToken || !chatId) return { ok: false, description: 'Missing Token or Chat ID' };
            try {
                const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: text,
                        parse_mode: 'HTML'
                    })
                });
                return await res.json();
            } catch (err) {
                return { ok: false, description: err.message };
            }
        }

        async function testTelegramBotConnection() {
            const token = document.getElementById('clsTgToken').value.trim();
            const chatId = document.getElementById('clsTgChatId').value.trim();
            const room = document.getElementById('clsRoom').value.trim() || 'ថ្មី';

            if (!token || !chatId) {
                showToast('សូមបញ្ចូល Telegram Bot Token និង Chat ID ជាមុនសិន!', 'warning');
                return;
            }

            showToast('កំពុងសាកល្បងផ្ញើសារទៅ Telegram...', 'info');
            const msg = `✅ <b>ការភ្ជាប់ប្រព័ន្ធគ្រប់គ្រងសាលារៀនជោគជ័យ!</b>\n🏫 សាលា៖ ${db.settings.schoolNameKh}\n📚 ថ្នាក់រៀន៖ <b>${room}</b>\n📅 ឆ្នាំសិក្សា៖ ${db.settings.currentYear}`;
            const result = await sendTelegramMessage(token, chatId, msg);

            if (result.ok) {
                showToast('🎉 ផ្ញើសារសាកល្បងទៅ Telegram ជោគជ័យ!', 'success');
            } else {
                showToast(`❌ បរាជ័យ៖ ${result.description || 'សូមពិនិត្យ Token ឬ Chat ID ម្តងទៀត'}`, 'error');
            }
        }

        async function sendTelegramAttendanceSummary(classId) {
            const cls = db.classes.find(c => c.id === classId);
            if (!cls || !cls.tgBotToken || !cls.tgChatId) return;

            const today = new Date().toISOString().split('T')[0];
            const classStudents = db.students.filter(s => s.room === cls.room && s.year === db.settings.currentYear);
            const todayRecords = db.attendance.filter(a => a.date === today && a.room === cls.room && a.targetType === 'Student');

            const present = todayRecords.filter(r => r.status === 'មានវត្តមាន').length;
            const late = todayRecords.filter(r => r.status === 'យឺត').length;
            const excused = todayRecords.filter(r => r.status === 'មានច្បាប់').length;
            const absent = todayRecords.filter(r => r.status === 'អវត្តមាន').length;

            let absentListText = todayRecords
                .filter(r => r.status !== 'មានវត្តមាន')
                .map(r => `• ${r.targetName} (${r.status}${r.reason ? ' - ' + r.reason : ''})`)
                .join('\n');
            if (!absentListText) absentListText = '• គ្មានសិស្សអវត្តមាន ឬមកយឺតទេ';

            const reportMsg = `📊 <b>របាយការណ៍វត្តមានប្រចាំថ្ងៃ - ថ្នាក់ ${cls.room}</b>\n` +
                `📅 កាលបរិច្ឆេទ៖ ${today}\n` +
                `👥 សិស្សសរុបក្នុងថ្នាក់៖ ${classStudents.length} នាក់\n` +
                `✅ មានវត្តមាន៖ ${present} នាក់\n` +
                `⏰ មកយឺត៖ ${late} នាក់\n` +
                `📝 មានច្បាប់៖ ${excused} នាក់\n` +
                `❌ អវត្តមាន៖ ${absent} នាក់\n\n` +
                `<b>បញ្ជីឈ្មោះសិស្សអវត្តមាន/យឺត៖</b>\n${absentListText}`;

            showToast(`កំពុងផ្ញើរបាយការណ៍ថ្នាក់ ${cls.room} ទៅ Telegram...`, 'info');
            const res = await sendTelegramMessage(cls.tgBotToken, cls.tgChatId, reportMsg);
            if (res.ok) {
                showToast(`✅ បានផ្ញើរបាយការណ៍វត្តមានថ្នាក់ ${cls.room} ទៅ Telegram រួចរាល់!`, 'success');
            } else {
                showToast(`❌ ផ្ញើមិនបានសម្រេច៖ ${res.description}`, 'error');
            }
        }

        // ============================================================================
        // CAMERA CAPTURE LOGIC FOR STUDENT PHOTO (Front / Back Camera)
        // ============================================================================
        let stuPhotoStream = null;
        let stuCameraFacingMode = 'user'; // 'user' = Front, 'environment' = Back
        let currentCapturedPhoto = '';

        async function startStudentPhotoCamera() {
            const box = document.getElementById('stuCameraBox');
            const video = document.getElementById('stuCameraVideo');
            if (!box || !video) return;

            stopStudentPhotoCamera();
            box.classList.remove('hidden');

            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('WebRTC not supported');
                }
                stuPhotoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: stuCameraFacingMode },
                    audio: false
                });
                video.srcObject = stuPhotoStream;
                video.muted = true;
                await video.play();
            } catch (err) {
                showToast('កម្មវិធីនេះមិនអនុញ្ញាត WebCam ទេ! សូមចុចប៊ូតុងពណ៌បៃតង "ថតរូបផ្ទាល់ (កាមេរ៉ាទូរស័ព្ទ)" ជំនួសវិញ។', 'error');
                box.classList.add('hidden');
            }
        }

        function switchStudentCameraFacing() {
            stuCameraFacingMode = stuCameraFacingMode === 'user' ? 'environment' : 'user';
            startStudentPhotoCamera();
            showToast(`បានប្តូរទៅកាមេរ៉ាខាង${stuCameraFacingMode === 'user' ? 'មុខ (Front)' : 'ក្រោយ (Back)'}`, 'info');
        }

        function captureStudentPhoto() {
            const video = document.getElementById('stuCameraVideo');
            const canvas = document.getElementById('stuCameraCanvas');
            if (!video || !canvas) return;

            if (!video.videoWidth || !video.videoHeight) {
                showToast('កាមេរ៉ាមិនទាន់បង្ហាញរូបភាពទេ! សូមប្រើប៊ូតុង "ថតរូបផ្ទាល់ (កាមេរ៉ាទូរស័ព្ទ)" ពណ៌បៃតង។', 'error');
                return;
            }

            canvas.width = 300;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');
            
            // Center crop square
            const size = Math.min(video.videoWidth, video.videoHeight);
            const sx = (video.videoWidth - size) / 2;
            const sy = (video.videoHeight - size) / 2;
            ctx.drawImage(video, sx, sy, size, size, 0, 0, 300, 300);

            currentCapturedPhoto = canvas.toDataURL('image/jpeg', 0.85);
            updateStudentPhotoPreview();
            stopStudentPhotoCamera();
            showToast('បានថតរូបសិស្សរួចរាល់!', 'success');
        }

        function handleStudentPhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 300;
                    canvas.height = 300;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 300, 300);
                    currentCapturedPhoto = canvas.toDataURL('image/jpeg', 0.85);
                    updateStudentPhotoPreview();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function updateStudentPhotoPreview() {
            const preview = document.getElementById('stuPhotoPreview');
            const placeholder = document.getElementById('stuPhotoPlaceholder');
            if (preview && placeholder) {
                if (currentCapturedPhoto) {
                    preview.src = currentCapturedPhoto;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                } else {
                    preview.classList.add('hidden');
                    placeholder.classList.remove('hidden');
                }
            }
        }

        function clearStudentPhoto() {
            currentCapturedPhoto = '';
            updateStudentPhotoPreview();
        }

        function stopStudentPhotoCamera() {
            if (stuPhotoStream) {
                stuPhotoStream.getTracks().forEach(track => track.stop());
                stuPhotoStream = null;
            }

            if (box) box.classList.add('hidden');
        }

        function clearDailyAttendanceRecords() {
            const targetDate = attendanceSelectedDate || new Date().toISOString().split('T')[0];
            confirmDelete(`ទិន្នន័យវត្តមានប្រចាំថ្ងៃទី ${targetDate}${attendanceFilterRoom !== 'ALL' ? ` (ថ្នាក់ ${attendanceFilterRoom})` : ''}`, () => {
                db.attendance = db.attendance.filter(a => {
                    const isSameDate = a.date === targetDate;
                    const isSameRoom = attendanceFilterRoom === 'ALL' || a.room === attendanceFilterRoom;
                    return !(isSameDate && isSameRoom);
                });
                logAudit('លុបទិន្នន័យវត្តមានប្រចាំថ្ងៃ', `ថ្ងៃទី ${targetDate}`);
                saveDB();
                renderAttendance(document.getElementById('mainContent'));
                showToast(`បានលុបទិន្នន័យវត្តមានថ្ងៃទី ${targetDate} រួចរាល់!`, 'info');
            });
        }

        function clearAttendancePanelMonthlyRecords() {

                db.attendance = db.attendance.filter(a => {
                    const isSameMonth = a.date && a.date.startsWith(targetMonth);
                    const isSameRoom = attendanceFilterRoom === 'ALL' || a.room === attendanceFilterRoom;
                    return !(isSameMonth && isSameRoom);
                });
                logAudit('លុបទិន្នន័យវត្តមានប្រចាំខែ', `ខែ ${targetMonth}`);

                showToast(`បានលុបទិន្នន័យវត្តមានខែ ${targetMonth} រួចរាល់!`, 'info');

            confirmDelete(`កំណត់ត្រាវត្តមានរបស់ ${rec.targetName} (${rec.date})`, () => {
                db.attendance = db.attendance.filter(x => x.id !== id);
                logAudit('លុបកំណត់ត្រាវត្តមាន', `${rec.targetName} (${rec.date})`);
                saveDB();
                renderAttendance(document.getElementById('mainContent'));
                showToast('បានលុបកំណត់ត្រាវត្តមានរួចរាល់', 'info');

            };

        function submitAttendanceRecord(scannedQrCode = null) {
            const rawCode = (scannedQrCode || document.getElementById('attQrInput')?.value || document.getElementById('attTargetSelect')?.value || '').trim();
            if (!rawCode) {
                showToast('សូមបញ្ចូល ឬស្គេនអត្តលេខជាមុនសិន!', 'error');
                return;
            }

            let target = db.students.find(s => s.id.toLowerCase() === rawCode.toLowerCase());
            let type = 'Student';

            if (!target) {
                target = db.teachers.find(t => t.id.toLowerCase() === rawCode.toLowerCase());
                type = 'Teacher';
            }

            if (!target) {
                showToast(`រកមិនឃើញអត្តលេខ "${rawCode}" ក្នុងប្រព័ន្ធទេ!`, 'error');
                return;
            }

            const today = document.getElementById('attFormDate')?.value || new Date().toISOString().split('T')[0];
            const targetRoom = (target.room || target.homeroom || '-').trim();
            const attStatus = document.getElementById('attStatus')?.value || 'មានវត្តមាន';
            
            // Auto-detect subject from timetable schedule if available for today (0 = Sunday, 1 = Monday, ..., 6 = Saturday)
            const daysMap = ['អាទិត្យ (Sunday)', 'ច័ន្ទ (Monday)', 'អង្គារ (Tuesday)', 'ពុធ (Wednesday)', 'ព្រហស្បតិ៍ (Thursday)', 'សុក្រ (Friday)', 'សៅរ៍ (Saturday)'];
            const dayName = daysMap[new Date().getDay()];
            const matchedSchedule = db.schedules.find(sch => 
                sch.room && sch.room.trim().toLowerCase() === targetRoom.toLowerCase() && 
                sch.day && sch.day.includes(dayName.split(' ')[0])
            );
            
            const attSubject = matchedSchedule ? matchedSchedule.subject : (document.getElementById('attSubject')?.value || 'វត្តមានប្រចាំថ្ងៃ');
            const attReason = document.getElementById('attReason')?.value || '';
            const timeNow = new Date().toLocaleTimeString('km-KH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            db.attendance.unshift({
                id: 'ATT-' + Date.now().toString().slice(-4),
                date: today,
                targetType: type,
                targetId: target.id,
                targetName: target.nameKh,
                room: targetRoom,
                subject: attSubject,
                status: attStatus,
                reason: attReason
            });
            logAudit('កត់ត្រាវត្តមាន', `${target.nameKh} (${target.id}) - ${attStatus} (${today})`);
            saveDB();

            if (type === 'Student') {
                const studentClass = db.classes.find(c => 
                    c.room && c.room.trim().toLowerCase() === targetRoom.toLowerCase() && 
                    (!c.year || c.year === db.settings.currentYear)
                );
                if (studentClass && studentClass.tgBotToken && studentClass.tgChatId) {
                    if (studentClass.tgAutoNotify) {
                        // Find teacher from matched schedule or homeroom teacher
                        const scheduleTeacher = matchedSchedule ? db.teachers.find(t => t.id === matchedSchedule.teacherId) : null;
                        const homeroomTeacher = studentClass.teacherId ? db.teachers.find(t => t.id === studentClass.teacherId) : null;
                        const teacherDisplay = scheduleTeacher ? scheduleTeacher.nameKh : (homeroomTeacher ? homeroomTeacher.nameKh : 'មិនទាន់កំណត់');

                        const tgText = `🔔 <b>ដំណឹងវត្តមានសិស្សតាមកាលវិភាគ - ថ្នាក់ ${targetRoom}</b>\n` +
                            `👤 សិស្ស៖ <b>${target.nameKh}</b> (${target.id})\n` +
                            `📚 មុខវិជ្ជាតាមតារាង៖ <b>${attSubject}</b>\n` +
                            `👨‍🏫 គ្រូបង្រៀន៖ <b>${teacherDisplay}</b>\n` +
                            `📌 ស្ថានភាព៖ <b>${attStatus}</b>\n` +
                            (attReason ? `📝 មូលហេតុ៖ ${attReason}\n` : '') +
                            `⏰ ម៉ោងស្គេន៖ ${timeNow} (${today})`;
                        
                        sendTelegramMessage(studentClass.tgBotToken, studentClass.tgChatId, tgText).then(res => {
                            if (res && res.ok) {
                                showToast(`📲 បានផ្ញើដំណឹងទៅ Telegram ថ្នាក់ ${targetRoom} រួចរាល់!`, 'success');
                            } else {
                                showToast(`⚠️ Telegram មិនដំណើរការ៖ ${res?.description || 'សូមពិនិត្យ Bot Token / Chat ID'}`, 'error');
                            }
                        });
                    } else {
                        showToast(`ℹ️ ថ្នាក់ ${targetRoom} បានបិទមុខងារផ្ញើ Telegram ស្វ័យប្រវត្តិ`, 'info');
                    }
                }
            } else if (type === 'Teacher') {
                // Find teacher's class or room (match by teacherId or homeroom)
                const teacherClasses = db.classes.filter(c =>

        function toggleLiveQrScanner() {
            const wrapper = document.getElementById('liveQrScannerWrapper');
            if (!wrapper) return;
            if (wrapper.classList.contains('hidden')) {
                startLiveQrScanner();
            } else {
                stopLiveQrScanner();
            }
        }

        let lastScannedTime = 0;
        async function startLiveQrScanner() {
            const wrapper = document.getElementById('liveQrScannerWrapper');
            const label = document.getElementById('qrCamFacingLabel');
            if (!wrapper) return;

            await stopLiveQrScanner();
            wrapper.classList.remove('hidden');
            if (label) label.innerText = qrScannerFacingMode === 'environment' ? 'ក្រោយ (Back)' : 'មុខ (Front)';

            try {
                if (typeof Html5Qrcode === 'undefined') {
                    showToast('ไลบรารี QR Scanner មិនទាន់ទាញយកបានទេ!', 'error');
                    wrapper.classList.add('hidden');
                    return;
                }
                html5QrScanner = new Html5Qrcode("qrReaderViewport");
                await html5QrScanner.start(
                    { facingMode: qrScannerFacingMode },
                    { fps: 10, qrbox: { width: 220, height: 220 } },
                    (decodedText) => {
                        const now = Date.now();
                        if (now - lastScannedTime < 2500) return; // Prevent duplicate rapid scans
                        lastScannedTime = now;
                        submitAttendanceRecord(decodedText);
                    },
                    (errorMessage) => { /* ignore frame scan errors */ }
                );
            } catch (err) {
                showToast('មិនអាចបើកកាមេរ៉ាស្គេន QR បានទេ សូមពិនិត្យសិទ្ធិអនុញ្ញាតកាមេរ៉ា!', 'error');
                wrapper.classList.add('hidden');
            }
        }

        async function switchQrScannerCamera() {
            qrScannerFacingMode = qrScannerFacingMode === 'environment' ? 'user' : 'environment';
            await startLiveQrScanner();
            showToast(`បានប្តូរទៅកាមេរ៉ាខាង${qrScannerFacingMode === 'environment' ? 'ក្រោយ (Back)' : 'មុខ (Front)'}`, 'info');
        }

        async function stopLiveQrScanner() {
            if (html5QrScanner) {
                try {
                    if (html5QrScanner.isScanning) {
                        await html5QrScanner.stop();
                    }
                    html5QrScanner.clear();
                } catch (e) {}
                html5QrScanner = null;
            }
            const wrapper = document.getElementById('liveQrScannerWrapper');
            if (wrapper) wrapper.classList.add('hidden');
        }

            saveDB(); renderSubjectsAndSchedule(document.getElementById('mainContent'));
        }

        function openAddScheduleModal(schId = null) {
            const sch = schId ? db.schedules.find(x => x.id === schId) : null;
            const availableClasses = db.classes.filter(c => !c.year || c.year === db.settings.currentYear);

                <form id="schForm" class="space-y-4">
                    <div id="schConflictAlert" class="hidden p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-xs rounded"></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold mb-1">ជ្រើសរើសបន្ទប់ / ថ្នាក់សិក្សា *</label>
                            <select id="schRoom" required class="w-full px-3 py-2 border rounded-xl text-sm bg-white">
                                <option value="">-- ជ្រើសរើសថ្នាក់រៀន --</option>
                                ${availableClasses.map(c => `<option value="${c.room}" ${sch?.room === c.room ? 'selected' : ''}>ថ្នាក់ទី ${c.grade} - បន្ទប់ ${c.room} (${c.group || 'ទូទៅ'})</option>`).join('')}
                                ${sch && !availableClasses.some(c => c.room === sch.room) ? `<option value="${sch.room}" selected>${sch.room}</option>` : ''}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">ថ្ងៃសិក្សា *</label>
                            <select id="schDay" class="w-full px-3 py-2 border rounded-xl text-sm bg-white">
                                ${['ច័ន្ទ (Monday)', 'អង្គារ (Tuesday)', 'ពុធ (Wednesday)', 'ព្រហស្បតិ៍ (Thursday)', 'សុក្រ (Friday)', 'សៅរ៍ (Saturday)'].map(d => `<option ${sch?.day === d ? 'selected' : ''}>${d}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">វេនសិក្សា (Session) *</label>
                            <select id="schSession" onchange="toggleCustomTimeInput(this.value)" class="w-full px-3 py-2 border rounded-xl text-sm bg-white font-medium text-primary-700">
                                <option value="វេនព្រឹក">🌅 វេនព្រឹក (Morning)</option>
                                <option value="វេនរសៀល">☀️ វេនរសៀល (Afternoon)</option>
                                <option value="សេរី">⚙️ កំណត់ម៉ោងដោយសេរី (Custom Free + AM/PM)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">ម៉ោងសិក្សា / កែប្រែម៉ោងតាមវេន *</label>
                            <div id="timeSelectWrapper">
                                <select id="schTime" class="w-full px-3 py-2 border rounded-xl text-sm font-mono bg-white">
                                    <option value="ម៉ោងទី១ (07:00 - 07:50)">ម៉ោងទី១ (07:00 - 07:50)</option>
                                    <option value="ម៉ោងទី២ (07:50 - 08:40)">ម៉ោងទី២ (07:50 - 08:40)</option>
                                    <option value="សម្រាក (08:40 - 09:00)">សម្រាក (08:40 - 09:00)</option>
                                    <option value="ម៉ោងទី៣ (09:00 - 09:50)">ម៉ោងទី៣ (09:00 - 09:50)</option>
                                    <option value="ម៉ោងទី៤ (09:50 - 10:40)">ម៉ោងទី៤ (09:50 - 10:40)</option>
                                </select>
                            </div>
                            <!-- Custom Time with AM / PM Selector -->
                            <div id="schCustomTimeWrapper" class="hidden flex gap-2 mt-1">
                                <input type="text" id="schCustomTime" value="${sch ? sch.time.replace(/ (AM|PM)/i, '') : '07:30 - 09:00'}" placeholder="07:30 - 09:00" class="flex-1 px-3 py-2 border border-primary-500 rounded-xl text-sm font-mono">
                                <select id="schAmPm" class="px-3 py-2 border border-primary-500 rounded-xl text-sm font-bold bg-primary-50 text-primary-800">
                                    <option value="AM">AM (ព្រឹក)</option>
                                    <option value="PM">PM (រសៀល)</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">មុខវិជ្ជា *</label>
                            <select id="schSub" class="w-full px-3 py-2 border rounded-xl text-sm bg-white">
                                ${db.subjects.map(s => `<option value="${s.nameKh}" ${sch?.subject === s.nameKh ? 'selected' : ''}>${s.nameKh}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">គ្រូបង្រៀន *</label>
                            <select id="schTch" class="w-full px-3 py-2 border rounded-xl text-sm bg-white">
                                ${db.teachers.map(t => `<option value="${t.id}" ${sch?.teacherId === t.id ? 'selected' : ''}>${t.nameKh} (${t.subject})</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold shadow-md">${sch ? 'រក្សាទុកការកែប្រែ' : 'រក្សាទុកកាលវិភាគ'}</button>
                </form>
            `);

            // If editing existing schedule, detect if it's afternoon or custom time
            if (sch) {
                if (sch.time.includes('រសៀល') || sch.time.includes('13:') || sch.time.includes('14:') || sch.time.includes('15:') || sch.time.includes('16:') || sch.time.includes('PM')) {
                    if (sch.time.includes('PM')) {
                        document.getElementById('schSession').value = 'សេរី';
                        toggleCustomTimeInput('សេរី');
                        document.getElementById('schCustomTime').value = sch.time.replace(' PM', '').replace(' AM', '');
                        document.getElementById('schAmPm').value = 'PM';
                    } else {
                        document.getElementById('schSession').value = 'វេនរសៀល';
                        toggleCustomTimeInput('វេនរសៀល');
                        document.getElementById('schTime').value = sch.time;
                    }
                } else if (!document.querySelector('#schTime option[value="' + sch.time + '"]')) {
                    document.getElementById('schSession').value = 'សេរី';
                    toggleCustomTimeInput('សេរី');
                    if (sch.time.includes('AM')) {
                        document.getElementById('schCustomTime').value = sch.time.replace(' AM', '');
                        document.getElementById('schAmPm').value = 'AM';
                    } else if (sch.time.includes('PM')) {
                        document.getElementById('schCustomTime').value = sch.time.replace(' PM', '');
                        document.getElementById('schAmPm').value = 'PM';
                    } else {
                        document.getElementById('schCustomTime').value = sch.time;
                        document.getElementById('schAmPm').value = 'AM';
                    }
                } else {
                    document.getElementById('schSession').value = 'វេនព្រឹក';
                    toggleCustomTimeInput('វេនព្រឹក');
                    document.getElementById('schTime').value = sch.time;
                }
            } else {
                toggleCustomTimeInput('វេនព្រឹក');
            }

            document.getElementById('schForm').onsubmit = (e) => {
                e.preventDefault();
                const room = document.getElementById('schRoom').value;
                const day = document.getElementById('schDay').value;
                const session = document.getElementById('schSession').value;
                
                let time = '';
                if (session === 'សេរី') {
                    const customVal = document.getElementById('schCustomTime').value.trim();
                    const amPmVal = document.getElementById('schAmPm').value;
                    time = `${customVal} ${amPmVal}`;
                } else {
                    time = document.getElementById('schTime').value;
                }

                const teacherId = document.getElementById('schTch').value;

                if (!time) {
                    showToast('សូមបញ្ចូលម៉ោងសិក្សាឱ្យបានត្រឹមត្រូវ!', 'warning');
                    return;
                }

                // Conflict Detection Logic
                const conflict = db.schedules.find(x => x.day === day && x.time === time && (x.room === room || x.teacherId === teacherId) && x.id !== schId);
                if (conflict) {
                    const alert = document.getElementById('schConflictAlert');
                    alert.innerText = `⚠️ មានការប៉ះទង្គិចម៉ោងសិក្សា! បន្ទប់ ${conflict.room} ឬ គ្រូបង្រៀនរូបនេះមានម៉ោងបង្រៀនរួចហើយនៅថ្ងៃ ${day} ម៉ោង "${time}"។`;
                    alert.classList.remove('hidden');
                    return;
                }

                if (sch) {
                    sch.room = room;
                    sch.day = day;
                    sch.time = time;
                    sch.subject = document.getElementById('schSub').value;
                    sch.teacherId = teacherId;
                    logAudit('កែប្រែកាលវិភាគសិក្សា', `បន្ទប់ ${room} (${day} - ${time})`);
                    showToast('បានកែប្រែកាលវិភាគសិក្សាជោគជ័យ!', 'success');
                } else {
                    db.schedules.push({
                        id: 'SCH-' + Date.now().toString().slice(-4),
                        room, day, time,
                        subject: document.getElementById('schSub').value,
                        teacherId
                    });
                    logAudit('បង្កើតកាលវិភាគសិក្សា', `បន្ទប់ ${room} (${day} - ${time})`);
                    showToast('បានរៀបចំកាលវិភាគដោយគ្មានការប៉ះទង្គិច!', 'success');
                }
                saveDB(); closeModal(); renderSubjectsAndSchedule(document.getElementById('mainContent'));
            };
        }

        function toggleCustomTimeInput(session) {
            const selectEl = document.getElementById('timeSelectWrapper');
            const customWrapper = document.getElementById('schCustomTimeWrapper');
            if (!selectEl || !customWrapper) return;

            if (session === 'សេរី') {
                selectEl.classList.add('hidden');
                customWrapper.classList.remove('hidden');
                document.getElementById('schCustomTime').focus();
            } else {
                customWrapper.classList.add('hidden');
                selectEl.classList.remove('hidden');
                updateScheduleTimePresets(session);
            }
        }

        function updateScheduleTimePresets(session) {
            const timeSel = document.getElementById('schTime');
            if (!timeSel) return;
            if (session === 'វេនព្រឹក') {
                timeSel.innerHTML = `
                    <option value="ម៉ោងទី១ (07:00 - 07:50 AM)">ម៉ោងទី១ (07:00 - 07:50 AM)</option>
                    <option value="ម៉ោងទី២ (07:50 - 08:40 AM)">ម៉ោងទី២ (07:50 - 08:40 AM)</option>
                    <option value="សម្រាក (08:40 - 09:00 AM)">សម្រាក (08:40 - 09:00 AM)</option>
                    <option value="ម៉ោងទី៣ (09:00 - 09:50 AM)">ម៉ោងទី៣ (09:00 - 09:50 AM)</option>
                    <option value="ម៉ោងទី៤ (09:50 - 10:40 AM)">ម៉ោងទី៤ (09:50 - 10:40 AM)</option>
                `;

                timeSel.innerHTML = `
                    <option value="ម៉ោងទី១ (01:00 - 01:50 PM)">ម៉ោងទី១ (01:00 - 01:50 PM)</option>
                    <option value="ម៉ោងទី២ (01:50 - 02:40 PM)">ម៉ោងទី២ (01:50 - 02:40 PM)</option>
                    <option value="សម្រាក (02:40 - 03:00 PM)">សម្រាក (02:40 - 03:00 PM)</option>
                    <option value="ម៉ោងទី៣ (03:00 - 03:50 PM)">ម៉ោងទី៣ (03:00 - 03:50 PM)</option>
                    <option value="ម៉ោងទី៤ (03:50 - 04:40 PM)">ម៉ោងទី៤ (03:50 - 04:40 PM)</option>
                `;
            }

        function deleteSchedule(id) {
            db.schedules = db.schedules.filter(s => s.id !== id);
            saveDB(); renderSubjectsAndSchedule(document.getElementById('mainContent'));
            showToast('បានលុបកាលវិភាគសិក្សារួចរាល់', 'info');
        }

        /**
         * ============================================================================
         * MODULE 5.5: CURRICULUM MANAGEMENT (គ្រប់គ្រងកម្មវិធីសិក្សា និងមេរៀន)
         * ============================================================================
         */
        let curFilterGrade = 'ALL';
        let curFilterSubject = 'ALL';

        function renderCurriculum(container) {
            if (!db.curriculum) db.curriculum = [];
            const uniqueGrades = [...new Set(['7', '8', '9', '10', '11', '12', ...db.classes.map(c => c.grade)])];
            
            const filtered = db.curriculum.filter(c => {
                const matchGrade = curFilterGrade === 'ALL' || c.grade === curFilterGrade;
                const matchSub = curFilterSubject === 'ALL' || c.subject === curFilterSubject;
                return matchGrade && matchSub;
            });

            const avgProgress = filtered.length > 0 
                ? Math.round(filtered.reduce((acc, c) => acc + Number(c.progress || 0), 0) / filtered.length) 
                : 0;

            container.innerHTML = `
                <!-- Header & Filters -->
                <div class="bg-white p-5 rounded-2xl shadow-xs border border-slate-100 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                    <div>
                        <h3 class="font-bold text-slate-800 text-base md:text-lg flex items-center gap-2">
                            <i class="fas fa-book-open text-primary-600"></i> គ្រប់គ្រងកម្មវិធីសិក្សា និងវឌ្ឍនភាពបង្រៀន
                        </h3>
                        <p class="text-xs text-slate-500 mt-0.5">កំណត់ជំពូក មេរៀន ចំនួនម៉ោងសិក្សា និងតាមដានភាគរយនៃការបង្រៀនតាមកម្រិតថ្នាក់នីមួយៗ</p>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                        <select onchange="curFilterGrade=this.value; renderCurriculum(document.getElementById('mainContent'))" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium outline-none focus:ring-2 focus:ring-primary-500">
                            <option value="ALL" ${curFilterGrade==='ALL'?'selected':''}>គ្រប់កម្រិតថ្នាក់</option>
                            ${uniqueGrades.map(g => `<option value="${g}" ${curFilterGrade===g?'selected':''}>${isNaN(g) ? g : 'ថ្នាក់ទី ' + g}</option>`).join('')}

                        <select onchange="curFilterSubject=this.value; renderCurriculum(document.getElementById('mainContent'))" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium outline-none focus:ring-2 focus:ring-primary-500">
                            <option value="ALL" ${curFilterSubject==='ALL'?'selected':''}>គ្រប់មុខវិជ្ជា</option>
                            ${db.subjects.map(s => `<option value="${s.nameKh}" ${curFilterSubject===s.nameKh?'selected':''}>${s.nameKh}</option>`).join('')}
                        </select>
                        <button onclick="openCurriculumModal()" class="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-primary-600/20 transition flex items-center gap-1.5 ml-auto lg:ml-0">
                            <i class="fas fa-plus"></i> បន្ថែមកម្មវិធីសិក្សា
                        </button>
                    </div>
                </div>

                <!-- Summary KPI Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs flex items-center gap-3">
                        <div class="w-11 h-11 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg"><i class="fas fa-layer-group"></i></div>
                        <div>
                            <p class="text-xs text-slate-500">ជំពូក / មេរៀនសរុប</p>
                            <h4 class="text-xl font-bold text-slate-800">${filtered.length} <span class="text-xs font-normal text-slate-400">ជំពូក</span></h4>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs flex items-center gap-3">
                        <div class="w-11 h-11 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg"><i class="fas fa-tasks"></i></div>
                        <div>
                            <p class="text-xs text-slate-500">វឌ្ឍនភាពបង្រៀនមធ្យម</p>
                            <h4 class="text-xl font-bold text-emerald-600">${avgProgress}%</h4>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs flex items-center gap-3">
                        <div class="w-11 h-11 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg"><i class="fas fa-clock"></i></div>
                        <div>
                            <p class="text-xs text-slate-500">ម៉ោងសិក្សាសរុបតាមកម្មវិធី</p>

                        </div>
                    </div>
                </div>

                <!-- Curriculum Table -->
                <div class="bg-white rounded-2xl shadow-xs border border-slate-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-600 border-b border-slate-200">
                                <tr>
                                    <th class="py-3.5 px-4">កម្រិតថ្នាក់</th>
                                    <th class="py-3.5 px-4">មុខវិជ្ជា</th>
                                    <th class="py-3.5 px-4">ជំពូក និងខ្លឹមសារមេរៀន</th>
                                    <th class="py-3.5 px-4 text-center">ម៉ោងសិក្សា</th>
                                    <th class="py-3.5 px-4">គ្រូទទួលបន្ទុក</th>
                                    <th class="py-3.5 px-4 w-44">វឌ្ឍនភាព (%)</th>
                                    <th class="py-3.5 px-4 text-right">សកម្មភាព</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${filtered.length === 0 ? `<tr><td colspan="7" class="py-8 text-center text-slate-400">មិនទាន់មានទិន្នន័យកម្មវិធីសិក្សាទេ សូមចុច "បន្ថែមកម្មវិធីសិក្សា"</td></tr>` :
                                filtered.map(c => {
                                    const tch = db.teachers.find(t => t.id === c.teacherId);
                                    const pct = Number(c.progress || 0);
                                    const barColor = pct >= 100 ? 'bg-emerald-500' : pct >= 50 ? 'bg-primary-600' : 'bg-amber-500';
                                    return `
                                        <tr class="hover:bg-slate-50/80 transition">
                                            <td class="py-3 px-4 font-bold text-primary-600">${isNaN(c.grade) ? c.grade : 'ថ្នាក់ទី ' + c.grade}</td>
                                            <td class="py-3 px-4"><span class="px-2.5 py-1 bg-blue-50 text-blue-700 rounded-lg text-xs font-semibold">${c.subject}</span></td>
                                            <td class="py-3 px-4">
                                                <p class="font-bold text-slate-800">${c.chapter}</p>
                                                <p class="text-xs text-slate-500 mt-0.5">${c.lessons || '-'}</p>
                                            </td>
                                            <td class="py-3 px-4 text-center font-semibold text-slate-700">${c.hours} ម៉ោង</td>
                                            <td class="py-3 px-4 text-xs text-slate-600">${tch ? tch.nameKh : 'មិនទាន់កំណត់'}</td>
                                            <td class="py-3 px-4">
                                                <div class="flex items-center justify-between text-xs mb-1">
                                                    <span class="font-semibold text-slate-700">${c.status}</span>
                                                    <span class="font-bold ${pct>=100?'text-emerald-600':'text-primary-600'}">${pct}%</span>
                                                </div>
                                                <div class="w-full bg-slate-100 rounded-full h-2">
                                                    <div class="${barColor} h-2 rounded-full transition-all duration-300" style="width: ${Math.min(pct, 100)}%"></div>

        let gradeFilterRoom = 'ALL'; // Selected room filter for grades

        function calculateGradeStats(g) {
            const total = Number(g.math) + Number(g.khmer) + Number(g.physics) + Number(g.chemistry) + Number(g.english);
            const avg = (total / 425) * 50; // Cambodian MoEYS 50-point scale
            let mention = 'F (ធ្លាក់)';
            let passed = false;
            if (avg >= 45) { mention = 'A (ល្អប្រសើរ)'; passed = true; }
            else if (avg >= 40) { mention = 'B (ល្អណាស់)'; passed = true; }
            else if (avg >= 35) { mention = 'C (ល្អ)'; passed = true; }
            else if (avg >= 30) { mention = 'D (ល្អបង្គួរ)'; passed = true; }
            else if (avg >= 25) { mention = 'E (មធ្យម)'; passed = true; }
            return { total, avg: avg.toFixed(2), mention, passed };
        }

            const filteredGrades = db.grades.filter(g => {

                const matchRoom = gradeFilterRoom === 'ALL' || g.room === gradeFilterRoom;
                return matchYear && matchRoom;

        function renderLibrary(container) {
            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                            <button onclick="openBookModal()" class="px-3 py-1.5 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-xs font-medium shadow-xs">+ បញ្ចូលសៀវភៅថ្មី</button>

                                        <button onclick="deleteBook('${b.id}')" title="លុបសៀវភៅ" class="p-1.5 text-red-600 hover:bg-red-50 rounded-lg transition"><i class="fas fa-trash"></i></button>

        function openBookModal(bookId = null) {
            const book = bookId ? db.library.find(x => x.id === bookId) : null;
            openModal(book ? 'កែប្រែព័ត៌មានសៀវភៅ' : 'បញ្ចូលសៀវភៅថ្មីក្នុងបណ្ណាល័យ', `
                <form id="bookForm" class="space-y-3">
                    <div><label class="block text-xs font-semibold mb-1">ចំណងជើងសៀវភៅ *</label><input type="text" id="bkTitle" required value="${book ? book.title : ''}" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm"></div>
                    <div><label class="block text-xs font-semibold mb-1">អ្នកនិពន្ធ</label><input type="text" id="bkAuthor" required value="${book ? book.author : ''}" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm"></div>
                    <div><label class="block text-xs font-semibold mb-1">ប្រភេទសៀវភៅ</label><input type="text" id="bkCat" value="${book ? book.category : 'សៀវភៅសិក្សាគោល'}" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs font-semibold mb-1">ចំនួនក្បាលសរុប</label><input type="number" id="bkQty" required min="1" value="${book ? book.totalCopies : 10}" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm"></div>
                        <div><label class="block text-xs font-semibold mb-1">ចំនួននៅសល់ក្នុងធ្នើ</label><input type="number" id="bkAvail" required min="0" value="${book ? book.availableCopies : 10}" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm"></div>
                    </div>
                    <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-sm font-medium">បោះបង់</button>
                        <button type="submit" class="px-5 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-xl text-sm font-semibold shadow-md">រក្សាទុកសៀវភៅ</button>
                    </div>
                </form>
            `);
            document.getElementById('bookForm').onsubmit = (e) => {
                e.preventDefault();
                const qty = Number(document.getElementById('bkQty').value);
                const avail = Math.min(qty, Number(document.getElementById('bkAvail').value));
                const data = {
                    id: book ? book.id : 'BK-' + Date.now().toString().slice(-3),
                    title: document.getElementById('bkTitle').value.trim(),
                    author: document.getElementById('bkAuthor').value.trim(),
                    category: document.getElementById('bkCat').value.trim(),
                    totalCopies: qty,
                    availableCopies: book ? avail : qty
                };
                if (book) {
                    const idx = db.library.findIndex(x => x.id === book.id);
                    db.library[idx] = data;
                    logAudit('កែប្រែព័ត៌មានសៀវភៅ', data.title);
                    showToast('បានកែប្រែព័ត៌មានសៀវភៅជោគជ័យ!', 'success');
                } else {
                    db.library.push(data);
                    logAudit('បន្ថែមសៀវភៅថ្មី', data.title);
                    showToast('បានបញ្ចូលសៀវភៅថ្មី!', 'success');
                }
                saveDB(); closeModal(); renderLibrary(document.getElementById('mainContent'));
            };
        }

        function deleteBook(id) {
            const book = db.library.find(x => x.id === id);
            if (!book) return;
            confirmDelete(`សៀវភៅ "${book.title}"`, () => {
                db.library = db.library.filter(x => x.id !== id);
                logAudit('លុបសៀវភៅពីបណ្ណាល័យ', book.title);
                saveDB();
                renderLibrary(document.getElementById('mainContent'));
                showToast(`បានលុបសៀវភៅ "${book.title}" រួចរាល់`, 'info');
            });
        }

                    brw.dueDate = document.getElementById('brwDue').value;
                    logAudit('កែប្រែកំណត់ត្រាខ្ចីសៀវភៅ', `${brw.bookTitle} - ${stu.nameKh}`);

                } else {
                    const book = db.library.find(b => b.id === document.getElementById('brwBook').value);
                    book.availableCopies -= 1;
                    db.borrowRecords.unshift({
                        id: 'BRW-' + Date.now().toString().slice(-3),
                        bookId: book.id,
                        bookTitle: book.title,
                        studentId: stu.id,
                        studentName: stu.nameKh,
                        borrowDate: document.getElementById('brwDate').value,
                        dueDate: document.getElementById('brwDue').value,
                        returnDate: '',
                        status: 'កំពុងខ្ចី'
                    });
                    logAudit('កត់ត្រាការខ្ចីសៀវភៅ', `${book.title} - ${stu.nameKh}`);
                    showToast('បានកត់ត្រាការខ្ចីសៀវភៅរួចរាល់!', 'success');
                }
                saveDB(); closeModal(); renderLibrary(document.getElementById('mainContent'));
            };
        }

        function deleteBorrowRecord(brwId) {
            const brw = db.borrowRecords.find(x => x.id === brwId);
            if (!brw) return;
            confirmDelete(`ប្រវត្តិខ្ចីសៀវភៅ "${brw.bookTitle}" របស់ ${brw.studentName}`, () => {
                if (brw.status === 'កំពុងខ្ចី') {
                    const book = db.library.find(b => b.id === brw.bookId);
                    if (book) book.availableCopies += 1;
                }
                db.borrowRecords = db.borrowRecords.filter(x => x.id !== brwId);
                logAudit('លុបប្រវត្តិខ្ចីសៀវភៅ', `${brw.bookTitle} - ${brw.studentName}`);
                saveDB();
                renderLibrary(document.getElementById('mainContent'));
                showToast('បានលុបប្រវត្តិខ្ចីសៀវភៅរួចរាល់', 'info');
            });
        }

        function returnBook(brwId) {
            const brw = db.borrowRecords.find(x => x.id === brwId);
            const book = db.library.find(b => b.id === brw.bookId);
            if (book) book.availableCopies += 1;
            brw.status = 'បានសងរួច';
            brw.returnDate = new Date().toISOString().split('T')[0];
            saveDB(); renderLibrary(document.getElementById('mainContent'));
            showToast('សិស្សបានសងសៀវភៅរួចរាល់!', 'success');
        }
